services:
  web-app:
    image: ${IMAGE:-}
    build:
      context: ../..
      dockerfile: apps/web-app/Dockerfile
      args:
        PUBLIC_AUTH_API_URL: ${PUBLIC_AUTH_API_URL:-http://127.0.0.1:13001}
    restart: unless-stopped
    ports: ["127.0.0.1:${WAPP_PORT:-13003}:13003"]
    networks:
      platform:
        aliases: [web-app]
networks:
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true
