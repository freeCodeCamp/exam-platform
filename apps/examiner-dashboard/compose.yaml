# Run from this directory: `docker compose up --build`. Build context is the repo root.
services:
  examiner-dashboard:
    image: ${IMAGE:-}
    build:
      context: ../..
      dockerfile: apps/examiner-dashboard/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${EDD_PORT:-13002}:13002"]
    environment:
      LISTEN_ADDR: 0.0.0.0:13002
      ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT to development, staging or production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      RUST_LOG: ${RUST_LOG:-info}
      WEB_DIR: /app/web
      GOOGLE_OAUTH_ID: ${GOOGLE_OAUTH_ID:?set GOOGLE_OAUTH_ID}
      GOOGLE_OAUTH_SECRET: ${GOOGLE_OAUTH_SECRET:?set GOOGLE_OAUTH_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:?set GOOGLE_REDIRECT_URL}
      COOKIE_KEY: ${COOKIE_KEY:?set COOKIE_KEY to at least 64 random bytes}
      EDB_DATABASE_URL: ${EDB_DATABASE_URL:?set EDB_DATABASE_URL}
    networks:
      platform:
        aliases: [examiner-dashboard]
  # One-shot: applies eDb migrations from this image, as `edb_migrator`, then exits. Never started by
  # `up` (profile). The deploy Action runs it with MIGRATE_IMAGE set to the image it is about to
  # deploy, and deploys only once it exits 0 (deploy/exam-platform.toml). Only it gets the
  # migrator's credentials, never examiner-dashboard.
  migrate:
    image: ${MIGRATE_IMAGE:-}
    profiles: [migrate]
    entrypoint: [edb-migrate]
    restart: "no"
    environment:
      EDB_MIGRATOR_URL: ${EDB_MIGRATOR_URL:-}
    networks: [platform]
networks:
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true
