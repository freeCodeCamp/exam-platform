# Dolt sql-server config. Mounted read-only; changes apply on restart.
# Info level: debug logs routine queries and results, which include private answer keys.
log_level: info
log_format: json
behavior:
  autocommit: true
  dolt_transaction_commit: false
  event_scheduler: "OFF"
  auto_gc_behavior:
    enable: true
listener:
  host: 0.0.0.0
  port: 3306
  max_connections: 50
  read_timeout_millis: 300000
  write_timeout_millis: 300000
# Explicit paths, all on the one volume, so a copy of the volume is a complete backup.
data_dir: /var/lib/dolt/databases
cfg_dir: /var/lib/dolt/config
privilege_file: /var/lib/dolt/config/privileges.db
branch_control_file: /var/lib/dolt/config/branch_control.db
system_variables:
  # Points at a directory that does not exist, stopping LOAD DATA / SELECT INTO OUTFILE queries.
  # We need to pass a directory because dolt does not pass NULL to MySQL.
  secure_file_priv: /directory/that/does/not/exist
  local_infile: false
  dolt_allow_commit_conflicts: 0
  dolt_force_transaction_commit: 0
