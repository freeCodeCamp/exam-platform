# eDb. Run from this directory: `docker compose up -d`. Production moves to hosted Postgres.
services:
  examiner-db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    ports: ["127.0.0.1:${EDB_PORT:-15432}:5432"]
    environment:
      POSTGRES_DB: examiner
      # eDd is the sole user and owns the schema: its embedded migrations need DDL.
      POSTGRES_USER: edd
      POSTGRES_PASSWORD: ${EDB_PASSWORD:?set EDB_PASSWORD}
    volumes:
      # Postgres 18+ keeps PGDATA in a major-version subdirectory of this mount.
      - examiner-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "edd", "-d", "examiner"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      platform:
        aliases: [examiner-db]
volumes:
  examiner-db:
networks:
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true
