# eDb. Run from this directory: `docker compose up -d`. Production moves to hosted Postgres.
services:
  examiner-db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    ports: ["127.0.0.1:${EDB_PORT:-15432}:5432"]
    environment:
      POSTGRES_DB: examiner
      # Bootstrap only (initdb/). edb-migrate connects as `edb_migrator`, eDd and aAPI as `edd` and `aapi`.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EDB_PASSWORD:?set EDB_PASSWORD}
      EDB_MIGRATOR_PASSWORD: ${EDB_MIGRATOR_PASSWORD:?set EDB_MIGRATOR_PASSWORD}
      EDB_EDD_PASSWORD: ${EDB_EDD_PASSWORD:?set EDB_EDD_PASSWORD}
      EDB_AAPI_PASSWORD: ${EDB_AAPI_PASSWORD:?set EDB_AAPI_PASSWORD}
    volumes:
      # Postgres 18+ keeps PGDATA in a major-version subdirectory of this mount.
      - examiner-db:/var/lib/postgresql
      # Runs on an empty volume only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "examiner"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      platform:
        aliases: [examiner-db]
volumes:
  examiner-db:
networks:
  platform:
    name: ${PLATFORM_NETWORK:-platform}
    external: true
