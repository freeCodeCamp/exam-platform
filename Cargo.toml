# Rust workspace for the Axum services: aAPI, cAPI and eDd's server. One lockfile and one
# target/. dApp's Tauri crate keeps its own workspace (apps/desktop-app/Cargo.toml) so server
# builds never resolve Tauri or webkit dependencies.
[workspace]
resolver = "3"
members = ["apps/auth-api", "apps/examiner-dashboard", "libs/*"]
exclude = ["apps/desktop-app"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie-private", "typed-header"] }
http = "1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }
# TODO: Currently set to match `sentry` dep version. Nice, but not necessary.
reqwest = { version = "0.13.5", default-features = false }
sentry = { version = "0.49.3", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "logs",
  "metrics",
  "panic",
  "release-health",
  "reqwest",
  "rustls",
  "tracing",
] }
thiserror = "2"
oauth2 = { version = "5.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
url = "2.5.8"
tower-sessions = "0.15"
runtime = { path = "libs/runtime" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
