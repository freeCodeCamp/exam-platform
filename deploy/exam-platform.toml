# eDb until production moves to hosted Postgres. Not part of the deploy Action: deploy by hand in
# Komodo, before aAPI and eDd. The volume outlives redeploys.
[[stack]]
name = "exam-platform-examiner-db"
description = "eDb: Postgres for eDd and aAPI"
tags = ["exam-platform"]
[stack.config]
server = "exam-platform"
repo = "freeCodeCamp/exam-platform"
branch = "main"
run_directory = "databases/examiner"
file_paths = ["compose.yaml"]
pre_deploy.command = "docker network inspect platform >/dev/null 2>&1 || docker network create platform"
extra_args = ["--wait", "--wait-timeout", "120"]
environment = """
EDB_PASSWORD=[[EXAM_PLATFORM_EXAMINER_DB_PASSWORD]]
EDB_MIGRATOR_PASSWORD=[[EXAM_PLATFORM_EXAMINER_DB_MIGRATOR_PASSWORD]]
EDB_EDD_PASSWORD=[[EXAM_PLATFORM_EXAMINER_DB_EDD_PASSWORD]]
EDB_AAPI_PASSWORD=[[EXAM_PLATFORM_EXAMINER_DB_AAPI_PASSWORD]]
"""

[[stack]]
name = "exam-platform-web-app"
description = "wApp: candidate web app, static files behind Caddy"
tags = ["exam-platform"]
[stack.config]
server = "exam-platform"
repo = "freeCodeCamp/exam-platform"
branch = "main"
run_directory = "apps/web-app"
file_paths = ["compose.yaml"]
registry_provider = "registry.digitalocean.com"
registry_account = "exam-platform"
pre_deploy.command = "docker network inspect platform >/dev/null 2>&1 || docker network create platform"
extra_args = ["--no-build", "--wait", "--wait-timeout", "120"]
environment = """
IMAGE=[[EXAM_PLATFORM_WEB_APP_IMAGE]]
AUTH_API_URL=https://auth-api.freecodecamp.dev
"""

[[action]]
name = "exam-platform-deploy"
description = "Deploys an exam-platform app by image digest. Run by GitHub Actions (.github/workflows/deploy.yml)."
tags = ["exam-platform"]
[action.config]
arguments = """
APP=
IMAGE=
"""
# Komodo interpolates variables into this script, so it must never contain two opening brackets in a row.
file_contents = '''
// Deploys one app by image digest. ARGS:
//   APP    auth-api | examiner-dashboard | web-app
//   IMAGE  registry.digitalocean.com/<registry>/<APP>@sha256:<digest>, or `previous`
// Variables per app, EXAM_PLATFORM_<APP>_:
//   IMAGE           what the stack runs. Set before each deploy, so it may be unhealthy.
//   IMAGE_HEALTHY   the last image a deploy confirmed healthy: the rollback target.
//   IMAGE_PREVIOUS  the healthy image before it, for `previous`.
//   MIGRATE_IMAGE   backends only: the image whose edb-migrate the stack's `migrate` service runs.
// Backends migrate eDb from the image first, and deploy only once that succeeds: a failed or
// unconfirmed migration leaves the running app untouched. Schema changes are never rolled back.
// Only admins may write Variables. The Action user is one, so CI needs Execute on this Action only.
// Komodo interpolates ARGS before the script runs: never echo them unvalidated.
const APPS = ["auth-api", "examiner-dashboard", "web-app"];
// Embed edb (databases/examiner), so ship edb-migrate.
const MIGRATES = ["auth-api", "examiner-dashboard"];
const app = String(ARGS.APP);
if (!APPS.includes(app)) throw new Error(`APP must be one of ${APPS.join(", ")}`);

const stack = `exam-platform-${app}`;
const prefix = `EXAM_PLATFORM_${app.toUpperCase().replaceAll("-", "_")}`;
const current = `${prefix}_IMAGE`;
const healthy = `${current}_HEALTHY`;
const previous = `${current}_PREVIOUS`;
const migrateImage = `${prefix}_MIGRATE_IMAGE`;
// Komodo pulls the image, then compose waits up to 120s (the stacks' --wait-timeout) for healthy
// containers.
const DEPLOY_SECONDS = 420;
// The pull, then edb-migrate, which gives up after 300s (TIMEOUT in databases/examiner/src/bin/).
// deploy.ts waits for a migration, a deploy and its rollback: keep its deadline above the sum.
const MIGRATE_SECONDS = 420;
// How long a request that errored may take to show up as an Update.
const START_SECONDS = 30;

const sleep = (seconds: number) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));
const describe = (err: unknown) => (err as { result?: { error?: string } })?.result?.error ?? String(err);

// For reads and idempotent writes: rides out a Core restart or a dropped connection.
async function retry<T>(what: string, call: () => Promise<T>): Promise<T> {
  for (let attempt = 1; ; attempt++) {
    try {
      return await call();
    } catch (err) {
      if (attempt === 4) throw new Error(`${what} failed: ${describe(err)}`);
      await sleep(2 ** attempt);
    }
  }
}

// Lists Variables rather than reading one: a failed read throws instead of passing for a missing Variable.
async function variables(): Promise<Map<string, string>> {
  const list = await retry("ListVariables", () => komodo.read("ListVariables", {}));
  return new Map(list.map((v) => [v.name, v.value ?? ""]));
}

async function set(name: string, value: string) {
  // Checks existence on every attempt: a create whose response was lost has still created it.
  await retry(`Writing ${name}`, async () => {
    if ((await komodo.read("ListVariables", {})).some((v) => v.name === name)) {
      await komodo.write("UpdateVariableValue", { name, value });
    } else {
      const description = `Image for ${stack}. Written by the exam-platform-deploy Action.`;
      await komodo.write("CreateVariable", { name, value, description });
    }
  });
}

// DeployStack and RunStackService both mark the stack deploying.
const deploying = async () => (await komodo.read("GetStackActionState", { stack })).deploying;

// The first `operation` Update for the stack since `since`, if Core has created one.
async function findUpdate(stackId: string, operation: string, since: number): Promise<string | undefined> {
  const query = { "target.type": "Stack", "target.id": stackId, operation, start_ts: { $gte: since } };
  return (await komodo.read("ListUpdates", { query })).updates.at(-1)?.id;
}

type Outcome = "success" | "failed" | "not-started" | "unknown";

// Starts `operation` on the stack and waits for it. Settles on Komodo's record of the run, never on
// a request's error: a request that failed may still have started it, and a poll that failed says
// nothing about it. "not-started": it never began, so nothing changed. "unknown": it did not finish
// in time, or its record could not be read.
async function run(
  stackId: string,
  operation: "DeployStack" | "RunStackService",
  start: () => Promise<{ _id?: { $oid: string } }>,
  seconds: number,
): Promise<Outcome> {
  const since = Date.now();
  let id: string | undefined;
  try {
    id = (await start())._id?.$oid;
  } catch (err) {
    console.error(`${operation} request failed, looking for the run: ${describe(err)}`);
  }
  const deadline = since + seconds * 1000;
  while (Date.now() < deadline) {
    await sleep(3);
    try {
      id ??= await findUpdate(stackId, operation, since);
      if (!id) {
        // Core creates the Update before it answers: none by now means the request never arrived.
        if (Date.now() - since > START_SECONDS * 1000 && !(await deploying())) return "not-started";
        continue;
      }
      const update = await komodo.read("GetUpdate", { id });
      if (update.status !== "Complete") continue;
      for (const log of update.logs) {
        if (!log.success) console.error(`${log.stage}:\n${log.stderr || log.stdout}`);
      }
      return update.success ? "success" : "failed";
    } catch (err) {
      console.error(`Polling ${operation} on ${stack}: ${describe(err)}`);
    }
  }
  return "unknown";
}

// Runs edb-migrate from `image` in a one-shot container (the stack's `migrate` service), on the
// Komodo host and network `platform`. Its exit code is the run's success. Touches no app container
// or app Variable.
async function migrate(stackId: string, image: string): Promise<Outcome> {
  await set(migrateImage, image);
  const request = { stack, service: "migrate", no_tty: true, no_deps: true, pull: true };
  return run(stackId, "RunStackService", () => komodo.execute("RunStackService", request), MIGRATE_SECONDS);
}

// Points the stack at `image` and deploys it.
async function deploy(stackId: string, image: string): Promise<Outcome> {
  await set(current, image);
  return run(stackId, "DeployStack", () => komodo.execute("DeployStack", { stack }), DEPLOY_SECONDS);
}

const vars = await variables();
const requested = String(ARGS.IMAGE);
const image = requested === "previous" ? vars.get(previous) : requested;
if (requested === "previous" && !image) throw new Error(`No previous image recorded for ${stack}`);
const digest = new RegExp(`^registry\\.digitalocean\\.com/[a-z0-9-]+/${app}@sha256:[0-9a-f]{64}$`);
if (!image || !digest.test(image)) {
  throw new Error(`IMAGE must be registry.digitalocean.com/<registry>/${app}@sha256:<digest>, or previous`);
}
const stackId = (await retry("GetStack", () => komodo.read("GetStack", { stack })))._id?.$oid;
if (!stackId) throw new Error(`${stack} has no id`);
// deploy.yml already runs one deploy per app at a time: this catches a deploy started from the Komodo UI.
if (await retry("GetStackActionState", deploying)) throw new Error(`${stack} is already deploying`);

// Every deploy of a backend, `previous` included: an older edb-migrate skips migrations it does not
// know, and still checks the checksums of those it does.
if (MIGRATES.includes(app)) {
  const migrated = await migrate(stackId, image);
  if (migrated !== "success") {
    throw new Error(
      {
        failed: `Migrations from ${image} failed: not deployed, ${stack} unchanged. Fix the migration, then deploy again.`,
        "not-started": `Migrations from ${image} never started: not deployed, ${stack} unchanged.`,
        unknown: `No result for the migrations from ${image}: not deployed. Check ${stack} in Komodo before deploying again.`,
      }[migrated],
    );
  }
  console.log(`eDb migrated from ${image}`);
}

const restore = vars.get(healthy) || undefined;
const outcome = await deploy(stackId, image);
if (outcome === "success") {
  // PREVIOUS first: failing between the writes leaves both on the old healthy image, so `previous`
  // loses nothing.
  const writes = [{ name: healthy, value: image }];
  if (restore && restore !== image) writes.unshift({ name: previous, value: restore });
  for (const [i, { name, value }] of writes.entries()) {
    try {
      await set(name, value);
    } catch (err) {
      const left = writes.slice(i).map((w) => `${w.name}=${w.value}`).join(", ");
      throw new Error(`${stack} runs ${image}, but recording it failed: set ${left} by hand. ${err}`);
    }
  }
  console.log(`${stack} runs ${image}`);
} else if (outcome === "not-started") {
  // The containers did not change: point IMAGE back, so a deploy from the Komodo UI does not pick up
  // the unconfirmed image.
  const before = vars.get(current);
  if (before && before !== image) await set(current, before);
  throw new Error(`Deploy of ${image} to ${stack} never started: nothing changed`);
} else if (outcome === "unknown") {
  // Rolling back now could overlap a deploy still running, or undo one that succeeded.
  throw new Error(`No result for the deploy of ${image} to ${stack}: not rolled back. Check the stack in Komodo.`);
} else if (!restore || restore === image) {
  throw new Error(`Deploy failed: ${stack} has no other healthy image to roll back to`);
} else {
  // No migration: `restore` ran healthy against the schema, which has only grown since.
  const restored = await deploy(stackId, restore);
  const rollback = {
    success: `${stack} rolled back to ${restore}`,
    failed: `rollback to ${restore} failed too: ${stack} needs attention`,
    "not-started": `rollback to ${restore} never started: ${stack} needs attention`,
    unknown: `no result for the rollback to ${restore}: check ${stack} in Komodo`,
  }[restored];
  throw new Error(`Deploy failed: ${rollback}`);
}
'''

# Every deploy pulls a new digest, so old images pile up. `docker image prune -a` keeps the images
# that containers use; a rollback pulls its image from DOCR again.
[[procedure]]
name = "exam-platform-prune-images"
description = "Removes Docker images that no container uses."
tags = ["exam-platform"]
[procedure.config]
schedule = "Every Sunday at 03:00"
schedule_timezone = "UTC"
schedule_alert = false
[[procedure.config.stage]]
name = "Prune images"
executions = [
  { execution.type = "PruneImages", execution.params.server = "exam-platform" },
]

# Holds the service user whose API key GitHub Actions uses (KOMODO_API_KEY / KOMODO_API_SECRET).
[[user_group]]
name = "exam-platform-ci"
users = ["exam-platform-ci"]
permissions = [
  { target.type = "Action", target.id = "exam-platform-deploy", level = "Execute" },
]
